# Ежедневное инкрементальное обновление
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-update
  namespace: goszakup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Almaty
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: update
              image: goszakup-agent:1.0      # замените на образ из своего реестра
              command: ["python", "update.py"]
              envFrom:
                - configMapRef: {name: goszakup-config}
                - secretRef: {name: goszakup-secrets}
              resources:
                requests: {cpu: 500m, memory: 2Gi}
                limits: {memory: 6Gi}
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: goszakup-data}
