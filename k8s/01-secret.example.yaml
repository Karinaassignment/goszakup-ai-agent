# Шаблон: скопировать в secret.yaml (в .gitignore), заполнить, kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: goszakup-secrets
  namespace: goszakup
type: Opaque
stringData:
  OWS_TOKEN: "<токен OWS v3>"
  POSTGRES_PASSWORD: "<пароль пользователя etl>"
  AGENT_DB_PASSWORD: "<пароль роли agent_ro (только чтение)>"
